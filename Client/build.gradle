plugins {
    id 'com.android.application'
}

tasks.register('removeBom') {
    doLast {
        fileTree('src/main/java').matching { include '**/*.java' }.each { file ->
            byte[] bytes = file.bytes
            if (bytes.length >= 3 && bytes[0] == (byte) -17 && bytes[1] == (byte) -69 && bytes[2] == (byte) -65) {
                byte[] newBytes = new byte[bytes.length - 3]
                System.arraycopy(bytes, 3, newBytes, 0, newBytes.length)
                file.bytes = newBytes
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn 'removeBom'
}

android {
    namespace 'com.coffeeshop.client'
    compileSdk 37

    defaultConfig {
        applicationId 'com.coffeeshop.client'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.google.zxing:core:3.5.3'
}
